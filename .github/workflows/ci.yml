name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Install locked development tools and package
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Check types
        run: mypy
      - name: Test with branch coverage
        run: pytest --cov=sentinel_bot --cov-report=term-missing
      - name: Docker foundation smoke check
        run: python scripts/docker_smoke.py
      - name: Docker website monitoring smoke check
        run: python scripts/monitoring_smoke.py
      - name: Docker Telegram smoke check
        run: python scripts/telegram_smoke.py
      - name: Docker incoming events smoke check
        run: python scripts/ingress_smoke.py
