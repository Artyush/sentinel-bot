services:
  sentinel:
    environment:
      SENTINEL_SMTP_TEST_ENABLED: "true"
      SENTINEL_SMTP_HOST: mailpit
      SENTINEL_SMTP_PORT: "1025"
      SENTINEL_SMTP_TIMEOUT_SECONDS: "5"
    depends_on:
      mailpit:
        condition: service_healthy

  mailpit:
    container_name: "${COMPOSE_PROJECT_NAME}-mailpit"
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "100"
      MP_MAX_AGE: 24h
      MP_MAX_MESSAGE_SIZE: "1"
      MP_SMTP_MAX_RECIPIENTS: "5"
      MP_SMTP_ALLOWED_RECIPIENTS: '@example\.test$$'
      MP_SMTP_DISABLE_RDNS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=1770
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    networks:
      - sentinel
      - mailpit-ui
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  sentinel:
    internal: true
  mailpit-ui:
