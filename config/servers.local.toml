# Synthetic counters only: this demo never observes the developer machine.
# Start with compose.yaml, compose.override.yaml and compose.metrics.yaml.
[runtime]
mode = "demo"
state_dir = "data"
heartbeat_interval_seconds = 0.2
health_timeout_seconds = 2
shutdown_timeout_seconds = 2
max_concurrency = 2

[email]
enabled = true
provider = "local_smtp"
local_host = "mailpit"
local_port = 1025
request_timeout_seconds = 5

[[servers]]
alias = "primary"
url = "http://metrics-fixture:9100/metrics"
poll_interval_seconds = 0.5
connect_timeout_seconds = 0.2
total_timeout_seconds = 0.5
failure_confirmation = 3
recovery_confirmation = 2

[[servers.filesystems]]
alias = "root"
mount = "/"

[[servers]]
alias = "secondary"
url = "http://metrics-fixture:9101/metrics"
poll_interval_seconds = 0.5
connect_timeout_seconds = 0.2
total_timeout_seconds = 0.5
failure_confirmation = 3
recovery_confirmation = 2
# Informational readings are still collected and shown in cached status.
cpu_alerts = false
memory_alerts = false

[[servers.filesystems]]
alias = "root"
mount = "/"
alerts = false
