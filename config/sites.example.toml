# Website monitoring settings; endpoint inventory is in checks.example.toml.
# Configuration reference: ../docs/configuration.md
[runtime]
mode = "monitor"
# Native state path; Compose overrides this with its persistent volume path.
state_dir = "data"
heartbeat_interval_seconds = 1.0
health_timeout_seconds = 5.0
shutdown_timeout_seconds = 5.0
# Shared maximum for concurrent website requests; supported range: 1 to 5.
max_concurrency = 5
# Relative to this TOML file; do not also define inline [[sites]] tables here.
sites_file = "checks.example.toml"
