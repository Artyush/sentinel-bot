[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-bot"
version = "0.1.0"
description = "Self-hosted technical monitoring and notifications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = ["aiohttp==3.14.5", "aiodns==4.0.4", "prometheus-client==0.26.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["src/sentinel_bot"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["sentinel_bot"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
